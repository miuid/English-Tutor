# English Tutor — production nginx config
# Serves the built React app and reverse-proxies API calls to the backend
# container on the internal compose network.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API calls — forwarded to the FastAPI backend.
    # Long timeouts: LLM coaching calls routinely take 30–60s.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Backend health check, handy for LAN monitoring.
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Built static assets get long-cache headers (Vite hashes filenames).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every other path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
