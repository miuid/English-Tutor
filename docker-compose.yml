services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////data/english_tutor.db
      - SKILLS_DIR=/skills
    volumes:
      - tutor-data:/data
      - ./skills:/skills:ro
    # Internal only — LAN traffic reaches the API through the frontend nginx proxy.
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # The single entry point for the whole app (UI + /api proxy).
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  tutor-data:
