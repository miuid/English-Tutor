services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////data/english_tutor.db
      - SKILLS_DIR=/skills
    volumes:
      - tutor-data:/data
      - ./skills:/skills:ro
    restart: unless-stopped

volumes:
  tutor-data:
